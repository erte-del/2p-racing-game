; Copy this to `backend.cfg` and fill it in with your own project's details.
;
; Both of these come off one page in the Supabase dashboard: Project Settings,
; then API. The url is the project URL; the key is the one labelled `anon`
; `public`.
;
; The anon key is meant to be public - it identifies the project, not the
; player, and it ships inside every copy of the game. What stops one player
; writing over another's time is the row level security in
; `backend/schema.sql`, not this key being secret. It is kept out of the
; repository anyway, because which project the game talks to is yours to
; decide rather than something baked into the source.
;
; A build with no `backend.cfg` in it is the game with no accounts and no
; boards, working exactly as it did before any of this existed.

[supabase]
url="https://your-project-ref.supabase.co"
anon_key="paste-the-anon-public-key-here"
